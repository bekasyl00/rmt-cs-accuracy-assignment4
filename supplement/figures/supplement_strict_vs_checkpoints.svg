<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"><title>Complete-answer reliability and checkpoint coverage</title>
<rect width="960" height="440" fill="white"/>
<g font-family="Arial, sans-serif" fill="#192b40">
<text x="32" y="38" text-anchor="start" font-size="23" font-weight="700">Complete-answer reliability and checkpoint coverage</text>
<text x="32" y="68" text-anchor="start" font-size="15" font-weight="400">Overall saved responses. Both measures use all planned items; their denominators differ.</text>
<rect x="440" y="83" width="16" height="16" fill="#244e78" rx="2"/>
<text x="463" y="96" text-anchor="start" font-size="14" font-weight="400">Fully correct answers</text>
<rect x="645" y="83" width="16" height="16" fill="#057b72" rx="2"/>
<text x="668" y="96" text-anchor="start" font-size="14" font-weight="400">Checkpoint points</text>
<path d="M 195.0 115 V 341" stroke="#d9e1e9"/>
<text x="195.0" y="365" text-anchor="middle" font-size="14" font-weight="400">0%</text>
<path d="M 311.0 115 V 341" stroke="#d9e1e9"/>
<text x="311.0" y="365" text-anchor="middle" font-size="14" font-weight="400">20%</text>
<path d="M 427.0 115 V 341" stroke="#d9e1e9"/>
<text x="427.0" y="365" text-anchor="middle" font-size="14" font-weight="400">40%</text>
<path d="M 543.0 115 V 341" stroke="#d9e1e9"/>
<text x="543.0" y="365" text-anchor="middle" font-size="14" font-weight="400">60%</text>
<path d="M 659.0 115 V 341" stroke="#d9e1e9"/>
<text x="659.0" y="365" text-anchor="middle" font-size="14" font-weight="400">80%</text>
<path d="M 775.0 115 V 341" stroke="#d9e1e9"/>
<text x="775.0" y="365" text-anchor="middle" font-size="14" font-weight="400">100%</text>
<text x="32" y="155" text-anchor="start" font-size="16" font-weight="700">Keyword search</text>
<rect x="195" y="130" width="58.0" height="20" fill="#244e78" rx="2"/>
<text x="261.0" y="145" text-anchor="start" font-size="14" font-weight="700">10.0% (4/40)</text>
<rect x="195" y="157" width="251.33333333333334" height="20" fill="#057b72" rx="2"/>
<text x="454.33333333333337" y="172" text-anchor="start" font-size="14" font-weight="700">43.3% (52/120)</text>
<text x="32" y="235" text-anchor="start" font-size="16" font-weight="700">Qwen code model</text>
<rect x="195" y="210" width="58.0" height="20" fill="#244e78" rx="2"/>
<text x="261.0" y="225" text-anchor="start" font-size="14" font-weight="700">10.0% (4/40)</text>
<rect x="195" y="237" width="212.66666666666666" height="20" fill="#057b72" rx="2"/>
<text x="415.66666666666663" y="252" text-anchor="start" font-size="14" font-weight="700">36.7% (44/120)</text>
<text x="32" y="315" text-anchor="start" font-size="16" font-weight="700">Qwen + BM25 RAG</text>
<rect x="195" y="290" width="87.0" height="20" fill="#244e78" rx="2"/>
<text x="290.0" y="305" text-anchor="start" font-size="14" font-weight="700">15.0% (6/40)</text>
<rect x="195" y="317" width="314.16666666666663" height="20" fill="#057b72" rx="2"/>
<text x="517.1666666666666" y="332" text-anchor="start" font-size="14" font-weight="700">54.2% (65/120)</text>
<text x="32" y="391" text-anchor="start" font-size="14" font-weight="400">Full correctness requires 3/3 checkpoints and no material added factual error.</text>
<text x="32" y="414" text-anchor="start" font-size="14" font-weight="400">Checkpoint percentage retains credit for correctly supplied facts in partial answers.</text>
</g>
</svg>
